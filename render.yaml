# Render Blueprint — 이 파일이 있으면 Render가 자동으로 서비스 설정을 잡아줍니다.
# 사용법: GitHub에 코드 푸시 → Render에서 "New +" → "Blueprint" → 이 저장소 선택.
services:
  - type: web
    name: date-course-recommender
    runtime: node
    plan: free
    region: singapore        # 한국에서 가장 가까운 무료 리전
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 비밀번호 보호: APP_PASSWORD 에 값을 넣으면 로그인 창이 뜹니다(나만 쓰기 권장).
      - key: APP_USERNAME
        value: "date"
      - key: APP_PASSWORD
        sync: false
      # 전국 라이브 검색을 쓰려면 KAKAO_REST_API_KEY 가 필요합니다(없으면 장소를 못 가져옴).
      # NAVER 키는 블로그 후기/감성태그용(선택), LLM 키는 AI 멘트용(선택).
      # Render 대시보드 > Environment 에서 값을 채우세요.
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_JS_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
