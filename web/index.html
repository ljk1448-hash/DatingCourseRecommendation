<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5a7e" />
  <title>오늘 우리, 어디 갈까?</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-navigation" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M1 6l7-3 8 3 7-3v15l-7 3-8-3-7 3z"/><path d="M8 3v15M16 6v15"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.6" style="fill:currentColor;stroke:none"/><circle cx="19" cy="12" r="1.6" style="fill:currentColor;stroke:none"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V4"/><path d="M5 4h13l-2.5 4 2.5 4H5"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" style="fill:currentColor;stroke:none"/><circle cx="15" cy="9" r="1.3" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.3" style="fill:currentColor;stroke:none"/><circle cx="9" cy="15" r="1.3" style="fill:currentColor;stroke:none"/><circle cx="15" cy="15" r="1.3" style="fill:currentColor;stroke:none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1 10 0"/><path d="M12 9V3M3 18h18M5 21h14M5.6 11.6 4.2 10.2M19.8 10.2l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></symbol>
  </defs></svg>
  <header class="app-header">
    <h1>오늘 우리, 어디 갈까?</h1>
    <p class="sub">지역과 분위기를 고르면 데이트 코스를 짜드려요</p>
  </header>

  <div id="resultsBar" class="results-bar" hidden>
    <button type="button" class="rb-btn" data-action="back-settings"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"></use></svg> 조건 바꾸기</button>
    <b>추천 결과</b>
    <button type="button" class="rb-btn rb-primary" data-action="redo"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg> 다시 추천</button>
  </div>

  <div id="offlineBar" class="offline-bar" hidden>⚠️ 오프라인 — 인터넷 연결을 확인해 주세요</div>

  <main>
    <div id="settingsView">
    <div class="home-hint" id="homeHint">💡 <b>지역</b>과 <b>분위기</b>를 고르고 아래 <b>💕 코스 추천받기</b>를 눌러보세요. 고르기 귀찮으면 <b>🎲</b>로 아무거나!</div>
    <section class="card">
      <h2><span class="step">1</span> 지역 <button id="locBtn" type="button" class="mini-btn"><svg class="ic" aria-hidden="true"><use href="#i-pin"></use></svg> 현재 위치</button></h2>
      <div id="sido" class="chips"></div>
      <div id="districts" class="chips scroll"></div>
    </section>

    <section class="card">
      <h2><span class="step">2</span> 원하는 분위기 <small>(여러 개 선택)</small></h2>
      <div id="tags" class="chips"></div>
    </section>

    <section class="card">
      <h2><span class="step">3</span> 동선 설정</h2>

      <div class="field">
        <label>이동 수단</label>
        <div id="transport" class="segmented">
          <button type="button" class="seg selected" data-mode="walk">🚶 도보</button>
          <button type="button" class="seg" data-mode="car">🚗 차량</button>
        </div>
      </div>

      <div class="field">
        <label>언제 시작해요? <small>(영업시간은 추정 — 방문 전 확인)</small></label>
        <div id="daypart" class="segmented">
          <button type="button" class="seg selected" data-daypart="morning"><svg class="ic" aria-hidden="true"><use href="#i-sun"></use></svg> 오전</button>
          <button type="button" class="seg" data-daypart="afternoon"><svg class="ic" aria-hidden="true"><use href="#i-sunset"></use></svg> 오후</button>
          <button type="button" class="seg" data-daypart="evening"><svg class="ic" aria-hidden="true"><use href="#i-moon"></use></svg> 저녁</button>
        </div>
      </div>

      <div class="field">
        <label><svg class="ic" aria-hidden="true"><use href="#i-pin"></use></svg> 출발지 <small>(선택 · 만나는 곳 기준 추천)</small></label>
        <div class="start-row">
          <input type="text" id="startInput" placeholder="역·가게·랜드마크 검색" autocomplete="off" />
          <button type="button" class="mini-btn" id="startSearchBtn">검색</button>
          <button type="button" class="mini-btn" id="startLocBtn" title="현재 위치"><svg class="ic" aria-hidden="true"><use href="#i-pin"></use></svg></button>
        </div>
        <div id="startResults" class="start-results" hidden></div>
        <div id="startChosen" class="start-chosen" hidden></div>
      </div>

      <div class="field">
        <label><svg class="ic" aria-hidden="true"><use href="#i-flag"></use></svg> 도착지 <small>(선택 · 출발↔도착 사이를 채움)</small></label>
        <div class="start-row">
          <input type="text" id="endInput" placeholder="역·가게·랜드마크 검색" autocomplete="off" />
          <button type="button" class="mini-btn" id="endSearchBtn">검색</button>
        </div>
        <div id="endResults" class="start-results" hidden></div>
        <div id="endChosen" class="start-chosen" hidden></div>
      </div>

      <div class="field" id="distanceField">
        <label for="distance">이동 거리 조절 <span id="distanceLabel" class="pill">보통 · 약 5km</span></label>
        <input type="range" id="distance" min="1" max="20" step="1" value="5" />
        <div class="range-hint"><span>가깝게</span><span>멀리까지</span></div>
      </div>

      <details class="more-opts">
        <summary>⚙️ 상세 옵션</summary>

        <div class="field">
          <label for="stops">코스 장소 수 <span id="stopsLabel" class="pill">4곳</span></label>
          <input type="range" id="stops" min="2" max="5" step="1" value="4" />
        </div>

        <div class="field toggle-row">
          <label for="includeNight">야경 · 술 한잔 포함</label>
          <label class="switch"><input type="checkbox" id="includeNight" checked /><span class="slider"></span></label>
        </div>

        <div class="field toggle-row">
          <label for="nearby">근교 지역까지 허용</label>
          <label class="switch"><input type="checkbox" id="nearby" /><span class="slider"></span></label>
        </div>

        <div class="field toggle-row">
          <label for="weather">비 오면 실내 위주</label>
          <label class="switch"><input type="checkbox" id="weather" /><span class="slider"></span></label>
        </div>

        <div class="field toggle-row">
          <label for="excludeVisited">가본 곳 제외</label>
          <label class="switch"><input type="checkbox" id="excludeVisited" /><span class="slider"></span></label>
        </div>

        <div class="field toggle-row" id="llmRow" hidden>
          <label for="useLlm">AI 추천 멘트 받기</label>
          <label class="switch"><input type="checkbox" id="useLlm" /><span class="slider"></span></label>
        </div>
      </details>
    </section>

    </div>
    <div id="results"></div>

    <div id="nearbyView" hidden>
      <div class="nearby-head">
        <b id="nearbyTitle">내 주변</b>
        <button class="rb-btn" type="button" data-action="nearby-refresh"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg> 새로고침</button>
      </div>
      <div class="near-loc-fix">
        <button class="link-btn" type="button" data-action="near-region-toggle">📍 위치가 정확하지 않나요? 지역 직접 선택</button>
        <div id="nearRegionPicker" class="near-region" hidden>
          <select id="nearSido" aria-label="시/도"></select>
          <select id="nearGu" aria-label="시군구"></select>
          <button class="nf" type="button" data-action="near-region-go">이 지역으로 보기</button>
        </div>
      </div>
      <div id="nearbyMap" class="map-box nearby-map"></div>
      <button class="near-cta" type="button" data-action="near-course">💕 이 근처로 코스 짜기</button>
      <div id="nearbyFilters" class="nearby-filters"></div>
      <div id="nearbyList"></div>
    </div>
  </main>

  <div class="cta-bar">
    <button id="randomBtn" class="btn-secondary" type="button" title="아무거나"><svg class="ic" aria-hidden="true"><use href="#i-dice"></use></svg></button>
    <button id="recommendBtn">💕 코스 추천받기</button>
  </div>

  <!-- 저장한 코스 -->
  <div id="savedPanel" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><b>저장한 코스</b><button class="x" type="button" data-action="close-saved">✕</button></div>
      <div id="savedList"></div>
    </div>
  </div>

  <!-- 코스 지도 -->
  <div id="mapModal" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head"><b id="mapTitle">코스 지도</b><button class="x" type="button" data-action="close-map">✕</button></div>
      <div id="mapContainer" class="map-box"></div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab active" type="button" data-action="tab-home" data-tab="home"><span class="tab-ico"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg></span><span>추천</span></button>
    <button class="tab" type="button" data-action="tab-nearby" data-tab="nearby"><span class="tab-ico"><svg class="ic" aria-hidden="true"><use href="#i-pin"></use></svg></span><span>내 주변</span></button>
    <button class="tab" type="button" data-action="tab-saved" data-tab="saved"><span class="tab-ico">♥</span><span>보관함 <span id="savedCount">0</span></span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
